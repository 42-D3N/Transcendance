services:
  reverse-proxy:
    image: transcendance-reverse-proxy
    build: ./srcs/reverse-proxy
    pull_policy: never
    restart: always
    networks:
      - transcendance
    ports:
      - "5000:5000"
  database:
    image: postgres:18-trixie
    restart: always
    networks:
      - transcendance
    env_file:
      - ./srcs/database/.env
    volumes:
      - pgdata:/var/lib/postgresql
  api:
    image: transcendance-api
    build: ./srcs/api
    pull_policy: never
    env_file:
      - ./srcs/api/srcs/.env
    restart: always
    depends_on:
      database:
        condition: service_started
    networks:
      - transcendance
    develop:
      watch:
        - path: ./srcs/api/srcs/srcs
          action: sync
          target: /app/srcs
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/api/srcs/package.json
  website:
    command: npm run dev -- --host
    image: transcendance-front-end
    build: ./srcs/website
    pull_policy: never
    env_file:
      - ./srcs/website/srcs/.env
    networks:
      - transcendance
    restart: always
    develop:
      watch:
        - path: ./srcs/website/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/website/srcs/package.json
  adminer:
    image: adminer
    restart: always
    networks:
      - transcendance
    ports:
      - 4040:8080

volumes:
  pgdata:

networks:
  transcendance:
    name: transcendance
