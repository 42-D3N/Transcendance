services:
  database:
    image: postgres:18-trixie
    restart: always
    networks:
      - transcendance
    env_file:
      - ./srcs/database/.env
    volumes:
      - pgdata:/var/lib/postgresql
  api:
    image: transcendance-api
    build: ./srcs/api
    pull_policy: never
    env_file:
      - ./srcs/api/srcs/.env
    ports:
      - 9090:9090
    restart: always
    depends_on:
      database:
        condition: service_started
    networks:
      - transcendance
    develop:
      watch:
        - path: ./srcs/api/srcs/srcs
          action: sync
          target: /app/srcs
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/api/srcs/package.json
  website:
    command: npm run dev -- --host
    image: transcendance-front-end
    build: ./srcs/website
    pull_policy: never
    env_file:
      - ./srcs/website/srcs/.env
    networks:
      - transcendance
    ports:
      - "5173:5173"
    restart: always
    develop:
      watch:
        - path: ./srcs/website/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/website/srcs/package.json
  game_server:
    command: npm run dev
    image: game_serv
    build: ./srcs/game-server
    pull_policy: never
    networks:
      - transcendance
    ports:
      - "3310:3310"
    restart: always
    develop:
      watch:
        - path: ./srcs/game-server/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/game-server/srcs/package.json
  adminer:
    image: adminer
    restart: always
    networks:
      - transcendance
    ports:
      - 8080:8080

volumes:
  pgdata:

networks:
  transcendance:
    name: transcendance