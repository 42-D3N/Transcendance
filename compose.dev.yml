services:
  reverse-proxy:
    image: transcendance-reverse-proxy
    build: ./srcs/reverse-proxy
    pull_policy: never
    restart: always
    networks:
      - transcendance
    ports:
      - "5000:5000"
    depends_on:
      - website
      - game_server
      - chat-server
  database:
    image: transcendance-db
    build: ./srcs/database
    pull_policy: never
    restart: always
    networks:
      - transcendance
    env_file:
      - ./srcs/database/.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
  api:
    image: transcendance-api
    build: 
      context: ./srcs/api
      target: dev
    pull_policy: never
    env_file:
      - ./srcs/api/srcs/.env
    restart: always
    depends_on:
      database:
        condition: service_healthy
    networks:
      - transcendance
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    develop:
      watch:
        - path: ./srcs/api/srcs/srcs
          action: sync
          target: /app/srcs
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/api/srcs/package.json
  website:
    command: npm run dev -- --host
    image: transcendance-front-end
    build: ./srcs/website
    pull_policy: never
    env_file:
      - ./srcs/website/srcs/.env
    networks:
      - transcendance
    restart: always
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - path: ./srcs/website/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/website/srcs/package.json
    depends_on:
      api:
        condition: service_started
  game_server:
    image: game_serv
    build:
      context: ./srcs/game-server
      target: dev
    pull_policy: never
    env_file:
      - ./srcs/game-server/srcs/.env
    networks:
      - transcendance
    restart: always
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - path: ./srcs/game-server/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/game-server/srcs/package.json
  chat-server:
    image: transcendance-chat-server
    build:
      context: ./srcs/chat-server
      target: dev
    pull_policy: never
    env_file:
      - ./srcs/chat-server/srcs/.env
    networks:
      - transcendance
    restart: always
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - path: ./srcs/chat-server/srcs/src
          action: sync
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./srcs/chat-server/srcs/package.json
    depends_on:
      api:
        condition: service_started
  adminer:
    image: adminer
    restart: always
    depends_on:
      database:
        condition: service_healthy
    networks:
      - transcendance
    ports:
      - 4040:8080

volumes:
  pgdata:

networks:
  transcendance:
    name: transcendance
